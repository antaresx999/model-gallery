{% extends "base.html" %}
{% block title %}{{ title }} · {{ site_name }}{% endblock %}
{% block body_class %}page-auth{% endblock %}
{% block content %}
<div class="auth-card">
  <div class="eyebrow">Geschützte Galerie</div>
  <h1>{{ title }}</h1>
  <p class="muted">Diese Galerie ist mit einem Passwort geschützt.</p>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}
  <form method="post" class="form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Passwort<input name="password" type="password" required autofocus></label>
    <button class="btn btn-primary btn-block">Galerie öffnen</button>
  </form>
</div>
{% endblock %}
